version: '3.8'

services:
  stdrequestbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stdrequestbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/stdrequestbot
      - DB_NAME=stdrequestbot
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bot-network

  mongodb:
    image: mongo:7.0
    container_name: stdrequest_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  bot-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
